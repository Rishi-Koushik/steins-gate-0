# Steins;Gate RE:BOOT shell — user configuration
# Installed to ~/.config/sg-shell/config.toml. Edit, then:
#   - shortcuts / wallpaper:  re-run  ./install.sh --apply-settings
#   - everything else is read when the lock screen / app next starts.

[home]
# Empty = the bundled Steins;Gate wallpaper. Any image path works.
wallpaper = ""
date_badge = true
# A small line under the badge: counts down to the next of these dates and turns orange on the day.
canon_dates = true
# Your own list replaces the built-in one, e.g. ["7.28 Radio Kaikan", "8.21 Operation Skuld"].
canon_list = []
# Now and then an Upa capsule drops onto the home screen; click it to add it to the collection
# (phone → Gadgets → Upa collection). About this many a day.
upa = true
upa_per_day = 3

[shortcuts]
# Alt+C console, Alt+P phone (as in the demo). console_alt is an optional second console key.
# Super+P cannot be used: GNOME reserves it for display switching.
console = "<Alt>c"
console_alt = ""
phone = "<Alt>p"
# The keyboard's Copilot key also opens / closes the phone.
copilot_key = true

[lock]
# false = keep GNOME's stock lock screen (also: press F12 on the lock screen at any time).
enabled = true
# "password" = type the account password on the nixie panel, Enter submits. Digits show on the tubes,
#              other characters as a dot; a longer password shows its last four.
# "none"     = no password on the lock screen: pick the save, the tubes spin, the session opens.
#              The account password itself stays (sudo, text consoles). Anyone at the keyboard gets in.
# "pin"      = account password IS a 4-digit PIN: digits show on the tubes, auto-submit after the 4th.
auth_mode = "none"
# false = no title menu (NEW GAME / CONTINUE …): the lock screen is only the nixie panel on black.
# With auth_mode = "none" the tubes just spin to 1.048596 and the session opens.
title_screen = false
video = true
music = true
music_volume = 0.85
sounds = true
# Play the 54 s unlock movie after a successful unlock.
unlock_movie = true
# Boot clip (46 s) before the title screen: "manual" = at login and after the console `lock`
# command / EXIT GAME, "always" = on every lock (idle too), "never".
boot_clip = "manual"
# Lock straight after login so the boot clip → title screen → nixie panel → unlock movie
# run on every power-on, like the demo: "always", "autologin" (only when GDM auto-login
# is on, so you never type the password twice), "never".
on_login = "always"
# The nixie panel shows a Lab Member badge. 0 = number from the account (first user = 001).
lab_member = true
lab_member_no = 0
# Name on the badge, e.g. "Hououin Kyouma". Empty = display_name, else the login name.
lab_member_name = ""
# Volume of the optional lock-screen room tone (sounds/pack/ambience.*, see docs/ASSETS.md).
ambience_volume = 0.5
# The clips and title screen are 16:9. "contain" shows the whole picture, with black bars
# above and below on a 16:10 panel; "cover" fills the screen and crops 5 % per side.
fit = "contain"
# Label shown on the save slot. Empty = the login name.
display_name = ""

[dmail]
# Press Tab on the lock screen (or pick EXTRA on the title menu) and type a short message: it is
# shown on this screen the next time the laptop boots, then kept in the phone's inbox.
# No password is needed to write one, exactly like the hint a stranger could leave on a sticky note.
enabled = true
# The PhoneWave's limit. Up to 280.
max_bytes = 36

[console]
# Empty = your login shell.
shell = ""
height = 200
tall_height = 480
font = "Adwaita Mono 13"

[phone]
contacts = ["Mayuri", "Daru", "Lukako", "Faris", "PhoneWave"]
# Desktop notifications are also filed in the phone's inbox as mail (stored on this machine only).
notifications_as_mail = true
# Contacts who are in the list above write to you: Mayuri at login, Daru when a build fails in the
# SG console, Faris when the battery is low. Highlighted words in their mails are your replies.
character_mails = true
whatsapp_user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

[amadeus]
# Amadeus (phone → Amadeus): Makise Kurisu, three sections — personality, memory, thinking.
# What she calls you. Empty = [lock] display_name, else the login name.
user_name = ""
# Files: "ask" = she may read, every change needs your OK on the phone (originals are backed up
# under ~/.local/share/sg-shell/amadeus/backups); "allow" = change without asking;
# "read-only"; "off". The phone's ⚙ screen can switch this too. Whatever she reads is sent to
# Google's API. Keys, passwords and browser data are always refused.
files = "ask"
# Folders she may look in.
folders = ["~"]
# She rings the phone when a command in the SG console ran longer than long_job_seconds (0 = never
# for jobs), when the battery drops to 10 %, and once if you are still up at 3 a.m.
calls = true
long_job_seconds = 120

[amadeus.thinking]
# Google Gemini model. API keys are not kept here: paste them on the phone (⚙), they go to
# ~/.config/sg-shell/amadeus/keys, one per line. Several keys are rotated when one is rate-limited.
model = "gemini-flash-latest"

[amadeus.salieri]
# Salieri: a local model that answers when Amadeus cannot be reached (no network, no API key).
# Needs Ollama running on this machine (pacman -S ollama; ollama pull <model>). Talk only, no file access.
# "auto" = use it when it is there, "off" = never.
enabled = "auto"
url = "http://127.0.0.1:11434"
# Empty = the first model Ollama has installed.
model = ""

[amadeus.memory]
# How many recent messages she is given each turn; how many long-term notes she may keep.
history_messages = 24
max_facts = 200

# [amadeus personality] is a text file you can edit: ~/.config/sg-shell/amadeus/personality.md
# Emotion pictures: ~/.local/share/sg-shell/amadeus/emotions/NAME.webp (neutral, smile, angry, …)

[mail]
# "mailto" = hand the draft to the default mail handler (xdg-open mailto:...).
send = "mailto"
